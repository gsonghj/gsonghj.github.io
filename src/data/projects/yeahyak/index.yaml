overview:
  - "==약국 프랜차이즈==의 분산된 운영 업무를 통합해 본사와 가맹점 간 업무를 효율화하는 ==B2B SaaS 플랫폼==입니다. 본사는 가맹점과 상품·재고·발주·반품을 관리하고, 가맹 약국은 상품 주문 및 반품, 공지 확인, 재고 및 정산 내역 조회 등의 업무를 처리할 수 있습니다. 여기에 가맹점별 판매 이력을 분석해 상품별 권장 발주량을 제안하는 AI 예측 기능과 약국 운영 정보 및 공공 의약품 데이터를 조회하는 AI 챗봇을 추가해 데이터 기반 운영 환경을 구축했습니다."
  - "**프론트엔드 팀장**을 맡아 아키텍처와 **인증·API·상태 관리 공통 구조를 설계**하고, 주요 화면 구현과 AI 예측 기능 연동을 담당했습니다. 화면 요구사항에 맞춰 **API 명세와 응답 구조를 재정비**하고, JWT 인증 구조와 초대 메일로 가입하는 흐름, 발주량 예측 로직 설계에 참여했습니다."

features:
  - title: 역할 기반 접근 제어 및 초대 가입
    details:
      - content: 본사와 가맹점 계정을 구분하고 역할에 따라 접근 가능한 페이지 분리
      - content: 이메일 초대 링크를 통한 신규 계정 등록

  - title: 상품 탐색 및 발주
    details:
      - content: 대·소분류 카테고리 체계로 상품 등록·수정·삭제
        tag: 본사
      - content: 카테고리와 키워드로 상품을 탐색하고 카트에 여러 상품을 담아 일괄 발주
        tag: 가맹점
      - content: 새로고침 후에도 카트 상태 유지

  - title: 발주·반품·재고 연계 관리
    details:
      - content: 발주·반품 요청 확인 및 처리 상태 변경
        tag: 본사
      - content: 반품 신청 시 기존 발주·반품 이력을 바탕으로 반품 가능 수량 자동 계산
        tag: 가맹점
      - content: 발주·반품 처리 결과를 본사와 가맹점 재고에 자동 반영

  - title: 전자지갑 및 정산 관리
    details:
      - content: 가맹점별 크레딧 한도 관리 및 충전
        tag: 본사
      - content: 크레딧 잔액 및 상세 거래 내역 조회
        tag: 가맹점
      - content: 발주 생성 시 발주 금액 차감 및 반품 완료 시 환급

  - title: AI 발주량 예측
    details:
      - content: 가맹점별 판매 이력을 분석해 상품별 권장 발주량을 예측하고 결과를 카트에 담아 실제 발주로 연결
