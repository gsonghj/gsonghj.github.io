      - content: 공공 데이터를 실시간 조회해 의약품 효능·주의사항·병용금기 정보 제공
        tag: Q&A

  - title: 공지사항
    details:
      - content: 리치 텍스트 에디터로 공지 작성·수정·삭제 및 첨부파일 관리
        tag: 본사
      - content: 카테고리와 키워드로 공지 검색
        tag: 가맹점

decisions:
  - 엔드포인트마다 달랐던 API 응답과 페이지네이션 구조를 제네릭 타입 `ApiResponse<T>`와 `PageResponse<T>`로 표준화했습니다. 프론트엔드에도 같은 타입을 정의해 데이터 구조와 처리 방식을 일관되게 맞췄습니다.

  - API 응답 캐싱·로딩·에러 처리는 TanStack Query에, 인증 정보와 카트는 Zustand에 맡겨 서버 상태와 클라이언트 전역 상태의 책임을 나눴습니다.

  - Access Token을 브라우저 스토리지 대신 Zustand 메모리에서 관리해 XSS 공격으로 토큰이 탈취될 위험을 줄였습니다. 새로고침 시 React Router `loader`에서 Refresh Token 기반 재발급과 권한 검증을 수행해 보호된 페이지를 렌더링하기 전에 인증 상태를 복원했습니다.

  - 쿼리 키를 도메인별 팩토리 패턴으로 모으고 목록·상세·조회 조건을 계층 구조로 구성했습니다. 데이터 변경 이후 무효화하고 재검증할 캐시도 이 구조에 따라 일관된 기준으로 관리했습니다.

  - 검색·필터·페이지네이션 상태를 `URLSearchParams`로 관리해 새로고침이나 브라우저 이동 뒤에도 조회 조건을 복원했습니다. 상위 카테고리 변경 시 하위 필터와 페이지를 초기화하는 로직은 커스텀 훅 내부에서 처리해 페이지 컴포넌트의 상태 관리를 단순화했습니다.

  - 역할별로 접근하는 페이지가 다르기 때문에 사용자가 실제로 접근하는 경로의 코드만 불러오도록 `React.lazy`와 `Suspense`로 라우트 단위 코드 분할을 적용했습니다.

troubleshooting:
  - title: 401 응답의 원인을 구분해 인증 처리 흐름 재설계
    problem: 로그인 화면에서 잘못된 인증 정보를 입력해도 로그인 실패 에러 토스트가 표시되지 않고 로그인 페이지로 리다이렉트됐습니다.
    analysis: Axios 공통 응답 인터셉터가 모든 `401`을 토큰 만료로 처리하고 있었습니다. 로그인 실패로 `401`이 반환된 경우에도 토큰 재발급을 시도했고, 재발급에 실패하면 로그인 페이지로 리다이렉트되면서 컴포넌트의 `onError`에서 로그인 실패를 처리하지 못했습니다. `401`이 인증을 시도하는 요청에서는 잘못된 인증 정보를, 이미 인증된 요청에서는 토큰 만료를 뜻하므로 둘을 구분해서 처리해야 했습니다.
    action: 자체 에러 처리가 필요한 엔드포인트는 공통 토큰 재발급 대상에서 제외했습니다. 토큰 만료로 판단되는 `401`에만 Refresh Token 기반 재발급과 원 요청 재시도를 수행하도록 인터셉터의 처리 흐름을 바꿨습니다.
    result: 잘못된 인증 정보를 입력하면 불필요한 토큰 재발급이나 리다이렉트 없이 컴포넌트에서 에러 토스트가 정상적으로 표시됩니다.

  - title: 공유 Promise로 동시 토큰 재발급 요청 단일화
    problem: Access Token이 만료된 상태에서 여러 API를 동시에 호출하면 요청마다 `401` 응답을 받고 각 응답 인터셉터가 독립적으로 Refresh Token 재발급을 요청할 수 있었습니다.
    analysis: Refresh Token Rotation 구조에서는 재발급할 때마다 Refresh Token이 새것으로 교체됩니다. 재발급 요청이 동시에 여러 번 나가면 먼저 처리된 요청이 토큰을 교체해, 뒤따르는 요청은 이미 무효가 된 토큰으로 재발급을 시도하게 되고 토큰 갱신 간 레이스 컨디션이 생길 수 있습니다. 재발급은 한 번만 실행하고, 나머지 요청은 그 결과를 기다렸다가 재시도하는 구조가 필요했습니다.
    action: Axios 모듈에 `reissuePromise`를 두어 진행 중인 토큰 재발급 요청을 공유하도록 했습니다. 첫 번째 `401`에서만 재발급 요청을 만들고, 이후 `401`을 받은 요청은 같은 `Promise`를 `await`한 뒤 갱신된 Access Token으로 원 요청을 재시도합니다.
    result: "동시 요청 3·5·10건 상황을 재현한 테스트에서 **토큰 재발급 요청 횟수가 각각 3·5·10회에서 1회로 줄었습니다.**"

  - title: CSS Container Query로 확장형 테이블 너비 제한
    problem: 테이블의 확장 행을 열면 컴포넌트의 가로 너비가 비정상적으로 늘어나 레이아웃이 깨졌습니다.
    analysis: '`Table` 컴포넌트의 `scroll={{ x: "max-content" }}` 설정은 내부 콘텐츠의 `max-content` 값을 기준으로 가로 스크롤 너비를 계산합니다. 확장 행의 `Descriptions` 컴포넌트가 너비 제약 없이 렌더링되어 너비를 계속 늘리는 원인이 됐습니다. 퍼센트 단위와 뷰포트 단위 모두 확장 행 내부 콘텐츠의 너비를 테이블의 실제 렌더링 너비에 맞춰 제한하지 못했습니다.'
    action: "`Table` 컴포넌트에 CSS Container Query 컨텍스트를 설정하고 확장 행 내부 콘텐츠의 너비를 `cqw` 단위로 지정했습니다. `cqw`는 컨테이너로 지정한 부모 요소의 너비를 기준으로 계산되므로, `Descriptions` 컴포넌트의 크기가 `Table` 컴포넌트의 실제 렌더링 너비에 맞춰 제한됩니다."
    result: 행을 펼쳐도 테이블 너비가 그대로 유지됩니다.
