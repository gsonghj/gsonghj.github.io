overview:
  - "여행자를 위한 ==제주 게스트하우스 탐색 플랫폼==입니다. 제주 여행을 준비하며 게스트하우스 정보가 블로그, SNS, 예약 플랫폼 등 여러 곳에 흩어져 있어 비교하기 번거로웠던 경험, 그리고 방탈출 테마를 조건별로 탐색할 때 유용하게 쓰던 앱에서 착안해 기획했습니다. 다양한 조건을 조합해 게스트하우스를 검색하고 지도에서 위치를 함께 확인할 수 있습니다. 위시리스트, 이미지 첨부 리뷰, 카카오톡 공유 기능을 제공해 탐색부터 저장, 공유, 기록까지 하나의 흐름으로 이어지게 했습니다."
  - "**개인 프로젝트로 서비스 기획과 데이터베이스 설계, 프론트엔드 구현, 인증·권한 정책 설계, 배포까지 전 과정을 담당**했습니다. Next.js App Router 위에 Feature-Sliced Design 아키텍처를 적용하고, TanStack Query를 이용한 서버 상태 및 캐시 관리와 낙관적 업데이트, 네이버 지도와 숙소 목록의 선택 상태 연동을 구현했습니다. Supabase를 백엔드로 활용해 복합 조건 검색을 위한 RPC, 사용자별 데이터 접근을 제어하는 RLS, 위시리스트 집계 데이터의 정합성 유지를 위한 Trigger를 설계했습니다."

features:
  - title: 인증
    details:
      - content: 이메일/비밀번호 로그인과 회원가입, 구글·카카오 OAuth 로그인 지원
      - content: 비밀번호 찾기·재설정 기능 제공

  - title: 게스트하우스 탐색
    details:
      - content: 키워드·인원·지역·가격·주차·파티 여부를 조합한 복합 조건 검색
      - content: 새로고침하거나 공유된 URL로 들어와도 검색 조건 유지
      - content: 무한 스크롤 탐색

  - title: 네이버 지도 연동
    details:
      - content: 데스크톱에서는 게스트하우스 목록과 지도를 함께 보여주고, 모바일에서는 목록·지도 뷰 전환 지원
      - content: 마커를 클릭하면 해당 카드로 스크롤하고, 캐러셀을 넘기면 해당 마커를 활성화하는 양방향 인터랙션 제공

  - title: 게스트하우스 상세
    details:
      - content: 숙소 이미지, 이용 안내와 소개, 객실 목록, 위치, 리뷰를 한 페이지에서 조회
      - content: 스크롤 위치에 따라 섹션 내비게이션 활성화
      - content: 상세 페이지 링크 복사 및 카카오톡 공유 지원

  - title: 리뷰
    details:
      - content: 별점과 내용, 최대 6장의 이미지를 첨부해 리뷰 작성·수정·삭제
      - content: 숙소 상세 페이지와 내가 작성한 리뷰 페이지에서 페이지 단위로 리뷰 조회

  - title: 위시리스트
    details:
      - content: 관심 있는 게스트하우스를 위시리스트에 저장
      - content: 찜하면 기본 위시리스트에 저장되고 새 위시리스트를 만들거나 기존 위시리스트를 선택해 이동

  - title: 마이페이지
    details:
      - content: 닉네임·프로필 이미지 수정 및 내가 작성한 리뷰 조회
      - content: 실시간 닉네임 중복 확인 및 이미지 미리보기 제공

decisions:
  - Feature-Sliced Design을 적용해 기능이 늘어나도 모듈 간 의존성이 얽히지 않게 했습니다. `app`, `views`, `widgets`, `features`, `entities`, `shared`로 레이어를 나누고 각 슬라이스는 `index.ts`를 공개 API로 사용해 외부에 필요한 모듈만 노출했습니다. Entity 간 타입 참조가 필요할 때는 `@x/{slice}` 형태의 공개 API를 두어 교차 참조 의도와 의존 방향을 코드 구조로 드러냈습니다.

  - 실행 환경에 따라 `QueryClient` 생성 전략을 분리했습니다. 서버에서는 요청마다 새 인스턴스를 만들어 요청 간에 캐시가 공유되지 않게 하고, 브라우저에서는 싱글턴 인스턴스를 재사용해 불필요한 캐시 초기화를 방지했습니다.

  - 클라이언트에서 여러 데이터를 각각 조회한 뒤 필터링하는 대신 Supabase RPC를 사용했습니다. 게스트하우스와 객실을 함께 조회하면서 인원에 따른 가격 계산, 조건 필터링, 전체 검색 결과 개수 집계를 데이터베이스에서 한 번에 처리해, 검색 규칙을 데이터 계층에 모으고 클라이언트의 조건 분기와 데이터 가공 부담을 줄였습니다.

  - 찜 버튼은 사용자가 즉각적인 반응을 기대하는 인터랙션이라고 판단해, 서버 응답을 기다리지 않고 캐시를 먼저 변경하는 낙관적 업데이트를 적용했습니다. Mutation 실행 전에 관련 쿼리를 취소해 진행 중인 요청과의 경쟁 상태를 방지하고 기존 데이터를 스냅샷으로 저장했습니다. 요청이 실패하면 이전 캐시로 롤백하고, 요청이 끝나면 서버 상태와 다시 동기화했습니다.

  - 찜 등록·해제 시 `wishlist_items`의 `INSERT`·`DELETE`를 기준으로 `guesthouses.wishlisted_count`를 갱신하는 Trigger를 구현했습니다. 클라이언트에 게스트하우스 수정 권한을 열어주지 않으면서도 위시리스트 아이템 변경과 집계값 갱신을 같은 트랜잭션 안에서 처리해 데이터 정합성을 유지했습니다.

  - 이미지는 사용 맥락별로 `sizes`를 구분해 필요 이상으로 큰 이미지가 요청되지 않게 했고 화면별 LCP 대상 이미지만 우선 로딩했습니다. 웹폰트는 필요한 글리프만 남기도록 서브셋해 초기 전송량을 줄였습니다.

  - 공개 페이지는 `generateMetadata`로 동적 메타데이터를 생성하고, 개인화 페이지는 검색 색인에서 제외했습니다. 홈에는 WebSite·SearchAction, 게스트하우스 상세 페이지에는 LodgingBusiness 구조화 데이터를 적용해 검색 엔진이 페이지의 콘텐츠와 구조를 이해하도록 했습니다.

troubleshooting:
  - title: 동적 렌더링 원인을 추적해 홈·상세 페이지 ISR 적용
    problem: 홈과 게스트하우스 상세 페이지는 모든 사용자에게 같은 공개 콘텐츠를 보여주기 때문에 ISR로 구성하려고 `revalidate`를 설정했습니다. 그런데 프로덕션 빌드 결과를 확인해 보니 두 경로 모두 Dynamic으로 분류되어, 요청마다 서버에서 새로 렌더링되고 있었습니다.
    analysis: 렌더링 경로에 포함된 코드를 단계적으로 제거하며 빌드 결과를 비교해 세 가지 원인을 찾았습니다. 첫째, 루트 레이아웃의 헤더에서 로그인 버튼 깜빡임을 없애기 위해 사용자 프로필을 서버에서 `prefetch`·`hydrate`했고, 이 과정에서 Supabase SSR Client가 `cookies()`를 읽어 하위 경로 전체가 동적 렌더링으로 전환됐습니다. 둘째, 홈과 상세 페이지의 데이터 조회에도 같은 쿠키 기반 Supabase SSR Client를 쓰고 있었습니다. 셋째, `/guesthouses/[guesthouseId]`에 `generateStaticParams`가 없어 빌드 시 미리 생성할 상세 페이지 경로가 정의되지 않았습니다.
    action: 먼저 루트 레이아웃에서 사용자 프로필 `prefetch`·`hydrate`를 제거해 공통 레이아웃이 인증 상태에 의존하지 않도록 했습니다. 로그인 버튼 깜빡임은 클라이언트에서 인증 상태를 조회하는 동안 버튼과 같은 크기의 빈 영역을 렌더링하는 방식으로 해결해 초기 UI 전환 시 레이아웃이 흔들리지 않게 했습니다. 다음으로 홈과 상세 페이지의 게스트하우스 데이터는 인증 상태와 무관한 공개 데이터이므로, `cookies()`를 읽지 않는 `@supabase/supabase-js` 기반 Public Client를 만들어 사용했습니다. 마지막으로 `/guesthouses/[guesthouseId]`에 `generateStaticParams`를 추가해 승인된 게스트하우스 ID를 기준으로 상세 페이지를 빌드 시점에 미리 생성했습니다.
    result: 인증이 필요한 사용자 데이터와 인증에 의존하지 않는 공개 콘텐츠의 데이터 접근 경계를 분리하고, 홈과 게스트하우스 상세 페이지를 ISR로 렌더링하도록 전환했습니다.

  - title: 보상 로직으로 DB·Storage 간 부분 실패의 영향 최소화
    problem: 리뷰 데이터는 PostgreSQL에, 첨부 이미지 파일은 Supabase Storage에 저장됩니다. 이미지 업로드나 DB 업데이트가 중간에 실패하면 어떤 리뷰에도 연결되지 않은 고립된 파일이나 불완전한 리뷰 데이터가 남을 수 있었습니다.
    analysis: 두 저장소는 하나의 트랜잭션으로 묶을 수 없어 DB 롤백만으로는 일관성을 보장할 수 없었습니다. 그래서 작업 순서를 설계해 실패 지점을 통제하고, 실패하면 이미 끝난 작업을 되돌리는 보상 로직이 필요하다고 판단했습니다. 수정은 생성과 달리 이미 확정된 리뷰가 있으므로, 실패하더라도 기존 데이터가 손상되지 않는 것을 우선했습니다.
    action: 리뷰 생성 시에는 리뷰 행(row)을 먼저 만들어 `reviewId`를 확보하고, 해당 ID가 포함된 경로에 이미지를 업로드한 뒤 이미지 URL을 리뷰 데이터에 반영했습니다. 이미지 업로드는 `Promise.allSettled`로 결과를 확인하고 일부만 실패해도 이미 업로드된 파일과 생성된 리뷰를 함께 정리하도록 했습니다. 리뷰 수정 시에는 새 이미지 업로드와 리뷰 데이터 반영을 마친 뒤 기존 이미지를 정리해, 중간에 실패해도 확정된 리뷰 데이터에 영향을 주지 않게 했습니다.
    result: 부분 실패가 일어나도 고립된 파일이나 불완전한 리뷰가 남는 상황을 줄였고, 리뷰 수정이 실패하더라도 기존 리뷰는 그대로 유지됩니다.

  - title: scrollend fallback 타이머로 섹션 내비게이션 상태 고착 해결
    problem: 상세 페이지에서 섹션 탭을 클릭한 뒤 직접 스크롤을 해도 활성 탭이 바뀌지 않는 경우가 있었습니다.
    analysis: 탭을 클릭하면 `scrollIntoView`로 스크롤을 실행합니다. 이동 중에는 `IntersectionObserver`가 활성 탭을 바꾸지 않도록 `scrollend` 이벤트가 발생하면 해제되는 `isScrolling` 플래그로 Observer 처리를 막았습니다. 그런데 클릭한 섹션이 이미 화면에 있거나 페이지의 최대 스크롤 지점에 가까워 실제 이동이 거의 없으면 `scrollend` 이벤트가 발생하지 않아 `isScrolling`이 `true`로 남았고 이후 스크롤에서도 Observer 콜백이 계속 무시됐습니다.
    action: "`scrollend` 이벤트를 기본 스크롤 완료 신호로 쓰고, 이벤트가 발생하지 않는 경우를 대비해 fallback 타이머를 함께 등록했습니다. 둘 중 먼저 실행되는 쪽이 `isScrolling`을 해제하고 남은 리스너와 타이머를 정리하도록 했습니다. 또한 정리 함수를 `cancelPendingScroll` `ref`에 저장해두고 새 스크롤을 시작하기 전에 이전 작업부터 정리해, 탭을 연달아 클릭해도 리스너와 타이머가 쌓이지 않게 했습니다."
    result: 스크롤 이동 거리와 관계없이 `isScrolling`이 항상 해제되어, 탭을 클릭한 뒤에도 스크롤 위치에 따라 활성 탭이 정상적으로 바뀝니다.
