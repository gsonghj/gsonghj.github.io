title: AI 면접 코치
description: 이력서와 채용공고를 기반으로 LangGraph 에이전트가 맞춤형 질문을 생성하고, 답변을 평가한 뒤 피드백을 제공하는 AI 모의면접 시뮬레이터입니다.
type: 팀 프로젝트 이후 개인 프로젝트로 확장
period:
  start: "2025.05"
  end: "2026.02"
techStack:
  - TypeScript
  - React
  - React Router
  - Tailwind CSS
  - shadcn/ui
  - Python
  - FastAPI
  - LangGraph
  - OpenAI GPT
  - PostgreSQL
  - Vercel
  - Railway
